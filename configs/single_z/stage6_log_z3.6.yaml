# Stage 6 log-space forecast at z=3.6 (KODIAQ-SQUAD).
# Loads the 11 Pareto CSVs produced by SLURM job 50553089
# (results/single_z_stage6_log/refit/z3.6/) and scores them against the GP.

mode: forecast_only
redshift: 3.6
output_dir: results/single_z_stage6_log/

parameters:
  - dtau0
  - tau0
  - ns
  - Ap
  - herei
  - heref
  - alphaq
  - hub
  - omegamh2
  - hireionz
  - bhfeedback

k_range:
  min: 0.001
  max: 0.04

data:
  source: kodiaq
  cov_scale: 1.0
  conservative: true
  mock_data: gp

gp:
  basedir: data/kodiaq_gp
  hires_subdir: hires

normalization:
  mode: auto
  fix:
    r: 0.8

combine: additive
target_space: log

pareto_csvs:
  source: per_parameter
  per_parameter:
    dtau0:      {pareto_csv: results/single_z_stage6_log/refit/z3.6/pareto_dtau0.csv}
    tau0:       {pareto_csv: results/single_z_stage6_log/refit/z3.6/pareto_tau0.csv}
    ns:         {pareto_csv: results/single_z_stage6_log/refit/z3.6/pareto_ns.csv}
    Ap:         {pareto_csv: results/single_z_stage6_log/refit/z3.6/pareto_Ap.csv}
    herei:      {pareto_csv: results/single_z_stage6_log/refit/z3.6/pareto_herei.csv}
    heref:      {pareto_csv: results/single_z_stage6_log/refit/z3.6/pareto_heref.csv}
    alphaq:     {pareto_csv: results/single_z_stage6_log/refit/z3.6/pareto_alphaq.csv}
    hub:        {pareto_csv: results/single_z_stage6_log/refit/z3.6/pareto_hub.csv}
    omegamh2:   {pareto_csv: results/single_z_stage6_log/refit/z3.6/pareto_omegamh2.csv}
    hireionz:   {pareto_csv: results/single_z_stage6_log/refit/z3.6/pareto_hireionz.csv}
    bhfeedback: {pareto_csv: results/single_z_stage6_log/refit/z3.6/pareto_bhfeedback.csv}

fisher:
  step_frac: 0.01
  rel_tol: 0.01
