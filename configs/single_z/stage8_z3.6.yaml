# Stage 8 production — single-z z=3.6 with aq operator + derivative gate.
# Pattern: SLURM refit array writes per-param Pareto CSVs to
# <output_dir>/refit/z3.6/, then this forecast_only run reads them
# (pareto_csvs.source=from_refit) and applies the derivative gate during
# equation selection. Compare to Stage 6 (results/single_z_stage6_log/).
mode: forecast_only
redshift: 3.6
output_dir: results/single_z_stage8/
parameters: [ns, Ap, hub, omegamh2, herei, heref, alphaq, hireionz, bhfeedback, dtau0, tau0]
k_range: {min: 0.001, max: 0.04}
data: {source: kodiaq, cov_scale: 1.0, conservative: true, mock_data: gp}
gp: {basedir: data/kodiaq_gp}
combine: additive
target_space: log
derivative_tol: 0.25
pareto_csvs: {source: from_refit}
fisher: {step_frac: 0.01, rel_tol: 0.01}
