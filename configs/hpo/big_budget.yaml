# Bigger PySR budget for the σ-targeted forecast-quality demo.
# Each PySR fit takes ~3-5 minutes at maxsize=50, niter=400.
# 8 random trials → ~30-45 min total wall time.
strategy: random
n_trials: 8
metric: sigma_targeted
target_loss: 1.0e-3
seed: 0
n_jobs: 1
cache_dir: results/hpo_cache_big

space:
  niterations:        [200, 400]
  populations:        [30, 50]
  population_size:    [33, 50]
  maxsize:            [30, 40, 50]
  parsimony:          [1.0e-4, 1.0e-3, 1.0e-2]
  binary_operators:
    - ["+", "-", "*", "/"]
  unary_operators:
    - ["log", "exp"]
    - ["log", "exp", "square"]
