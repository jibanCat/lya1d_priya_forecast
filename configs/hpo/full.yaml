# Paper-quality HPO budget.
strategy: random
n_trials: 60
metric: complexity_at_target
target_loss: 1.0e-3
seed: 0
n_jobs: 1
cache_dir: results/hpo_cache

space:
  niterations:        [40, 100, 200]
  populations:        [15, 30]
  population_size:    [33, 50]
  maxsize:            [15, 20, 30]
  parsimony:          [1.0e-4, 1.0e-3, 1.0e-2]
  binary_operators:
    - ["+", "-", "*", "/"]
    - ["+", "-", "*", "/", "pow"]
  unary_operators:
    - []
    - ["log", "exp"]
    - ["log", "exp", "sqrt"]
